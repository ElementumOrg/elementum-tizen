name: build

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

env:
  TIZEN_CLI_URL: https://download.tizen.org/sdk/Installer/tizen-studio_6.1/web-cli_Tizen_Studio_6.1_ubuntu-64.bin
  TIZEN_CLI_SHA256: 7f33fe09eda4eb5d50463cf997e8f676d455060720470070ae1932994413aaf4

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test # pretest builds dist/

      - name: Cache Tizen Studio CLI
        id: tizen-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/tizen-studio
          key: tizen-studio-${{ env.TIZEN_CLI_SHA256 }}
      - name: Install Tizen Studio CLI
        if: steps.tizen-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/web-cli.bin" "$TIZEN_CLI_URL"
          echo "$TIZEN_CLI_SHA256  $RUNNER_TEMP/web-cli.bin" | sha256sum -c -
          # The installer refuses to run as root; the hosted runner user is not root.
          bash "$RUNNER_TEMP/web-cli.bin" --accept-license "$HOME/tizen-studio"
      - run: echo "$HOME/tizen-studio/tools/ide/bin" >> "$GITHUB_PATH"

      # Upload dist/ before packaging: `tizen package` writes signature files into it.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      - name: Package .wgt
        env:
          # Pushes (main, tags) only: pull requests always sign with a throwaway certificate.
          AUTHOR_P12_BASE64: ${{ github.event_name == 'push' && secrets.TIZEN_AUTHOR_P12_BASE64 || '' }}
          AUTHOR_PASSWORD: ${{ github.event_name == 'push' && secrets.TIZEN_AUTHOR_PASSWORD || '' }}
        run: |
          keystore="$HOME/tizen-studio-data/keystore/author"
          mkdir -p "$keystore"
          if [ -n "$AUTHOR_P12_BASE64" ]; then
            echo "::add-mask::$AUTHOR_PASSWORD"
            echo "$AUTHOR_P12_BASE64" | base64 -d > "$keystore/ci.p12"
            pw="$AUTHOR_PASSWORD"
          else
            echo "No TIZEN_AUTHOR_P12_BASE64 secret: signing with a throwaway author certificate."
            pw="$(openssl rand -hex 16)"
            tizen certificate -a ci -p "$pw" -f ci
          fi
          tizen security-profiles add -n ci -a "$keystore/ci.p12" -p "$pw"
          # The CLI reads signing passwords through libsecret (`secret-tool lookup ... keyfile <x.pwd>`),
          # which has no keyring on a headless runner. Replace it with a stub that prints the
          # <x.pwd> file, and write the passwords there (the distributor one is Tizen's public default).
          # shellcheck disable=SC2016 # $1/$4 belong to the stub
          printf '#!/bin/sh\n[ "$1" = lookup ] && cat "$4"\n' > "$HOME/tizen-studio/tools/certificate-encryptor/secret-tool"
          printf '%s' "$pw" > "$keystore/ci.pwd"
          dist_pwd="$HOME/tizen-studio-data/tools/certificate-generator/certificates/distributor"
          mkdir -p "$dist_pwd"
          printf '%s' tizenpkcs12passfordsigner > "$dist_pwd/tizen-distributor-signer.pwd"
          # Absolute paths: the tizen launcher changes directory.
          tizen package -t wgt -s ci -o "$PWD/out" -- "$PWD/dist"
          # `tizen package` exits 0 and writes an unsigned .wgt when signing fails.
          unzip -l out/Elementum.wgt | grep -q author-signature.xml
          unzip -l out/Elementum.wgt | grep -q signature1.xml
          mv out/Elementum.wgt "out/Elementum-$(node -p 'require("./package.json").version').wgt"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wgt
          path: out/Elementum-*.wgt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag must match package.json version
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wgt
      - name: GitHub Release with the .wgt
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "Elementum-${GITHUB_REF_NAME#v}.wgt" --generate-notes
